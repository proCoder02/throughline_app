name: throughline
description: Throughline mobile client (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_slidable: ^3.1.1
  connectivity_plus: 7.0.0
  shimmer: ^3.0.0
  provider: ^6.1.2
  intl: ^0.19.0
  record: ^6.2.1
  path_provider: ^2.1.3
  livekit_client: 2.8.0
  audioplayers: ^6.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  image_picker: ^1.2.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.1

dependency_overrides:
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true

# Generates the native (pre-Flutter-engine) splash screen -- fixes a plain
# black frame some OEM Android skins (e.g. ColorOS) show for a moment
# during a cold start, before the app's own LaunchTheme/windowBackground
# even gets applied. Solid color only -- no logo exists yet; swap in an
# `image:` key here (plus android_12.image) once there's a real one, then
# re-run `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#F0F2F5"
  android_12:
    color: "#F0F2F5"
