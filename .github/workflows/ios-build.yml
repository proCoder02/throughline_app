name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      # receive_sharing_intent 1.9+ ships for iOS through Swift Package Manager only;
      # the other plugins still come from CocoaPods (Flutter mixes the two).
      - run: flutter config --enable-swift-package-manager

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      # Package the .ipa here on macOS: upload-artifact drops Unix permissions,
      # so a Runner.app zipped on Windows loses the executable bit and iOS won't
      # launch it. zip keeps permissions (-y keeps symlinks); upload-artifact
      # then wraps this one file without touching what's inside it.
      - name: Package unsigned .ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry Throughline-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Throughline-ipa
          path: build/ipa/Throughline-unsigned.ipa
