name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      # receive_sharing_intent 1.9+ ships for iOS through Swift Package Manager only;
      # the other plugins still come from CocoaPods (Flutter mixes the two).
      - run: flutter config --enable-swift-package-manager

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios/iphoneos/Runner.app
